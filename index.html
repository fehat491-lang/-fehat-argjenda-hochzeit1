<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fehat & Argjenda — Ftesë Dasme</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

  :root{
    --gold:#b28a3a;
    --gold2:#d8bd78;
    --ivory:#fffdf8;
    --paper:#f8f3e8;
    --ink:#5b4930;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(circle at 20% 15%, rgba(216,189,120,.22), transparent 30%),
      radial-gradient(circle at 80% 85%, rgba(178,138,58,.18), transparent 32%),
      linear-gradient(135deg,#fffdf8,#f1eadb);
    color:var(--ink);
    font-family:"Cormorant Garamond", Georgia, serif;
  }
  .stage{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    perspective:1400px;
    position:relative;
  }
  .glow{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.8), transparent 42%),
      radial-gradient(circle at 50% 10%, rgba(216,189,120,.12), transparent 35%);
  }
  .hint{
    position:absolute;bottom:5.5vh;left:50%;transform:translateX(-50%);
    font-size:clamp(14px,3.8vw,20px);letter-spacing:.16em;
    text-transform:uppercase;color:#80683c;
    animation:pulse 1.8s ease-in-out infinite;
    z-index:30;white-space:nowrap;
  }
  @keyframes pulse{50%{opacity:.45;transform:translateX(-50%) translateY(-3px)}}

  .envelope-wrap{
    width:min(88vw,560px);
    aspect-ratio:1.52/1;
    position:relative;
    cursor:pointer;
    transform-style:preserve-3d;
    filter:drop-shadow(0 24px 35px rgba(91,73,48,.20));
  }
  .envelope{
    position:absolute;inset:0;
    transform-style:preserve-3d;
  }
  .back{
    position:absolute;inset:0;border-radius:7px;
    background:linear-gradient(145deg,#fffefb,#eee5d3);
    border:1px solid rgba(178,138,58,.55);
    overflow:hidden;
  }
  .back:after{
    content:"";position:absolute;inset:12px;
    border:1px solid rgba(178,138,58,.22);border-radius:4px;
  }
  .flap{
    position:absolute;left:0;right:0;top:0;height:64%;
    background:linear-gradient(155deg,#fffefa,#e8ddc8);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:50% 0%;
    border-top:1px solid rgba(178,138,58,.35);
    z-index:7;
    transition:transform 1.25s cubic-bezier(.65,.02,.2,1);
    backface-visibility:hidden;
  }
  .flap:after{
    content:"";position:absolute;left:50%;top:42%;
    width:82px;height:82px;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,#d9bc73 0 40%,#b28a3a 41% 44%,#f6e9bd 45% 100%);
    box-shadow:0 5px 12px rgba(91,73,48,.18);
  }
  .seal{
    position:absolute;left:50%;top:42%;
    transform:translate(-50%,-50%);z-index:9;
    color:white;font-family:Georgia,serif;font-size:27px;
    text-shadow:0 1px 1px rgba(80,55,20,.4);
    pointer-events:none;
  }
  .front{
    position:absolute;left:0;right:0;bottom:0;height:66%;
    background:linear-gradient(155deg,#fffdf8,#eee4d0);
    clip-path:polygon(0 0,50% 62%,100% 0,100% 100%,0 100%);
    z-index:6;border-bottom:1px solid rgba(178,138,58,.5);
  }
  .side-left,.side-right{
    position:absolute;bottom:0;width:52%;height:100%;
    background:linear-gradient(145deg,#f8f1e4,#e8dcc5);z-index:5;
  }
  .side-left{left:0;clip-path:polygon(0 0,100% 50%,100% 100%,0 100%)}
  .side-right{right:0;clip-path:polygon(100% 0,0 50%,0 100%,100% 100%)}

  .card{
    position:absolute;left:6%;right:6%;top:6%;bottom:3%;
    background:
      radial-gradient(circle at 15% 12%,rgba(216,189,120,.18),transparent 20%),
      radial-gradient(circle at 85% 88%,rgba(216,189,120,.16),transparent 20%),
      var(--paper);
    border:1px solid rgba(178,138,58,.55);
    box-shadow:0 12px 30px rgba(91,73,48,.18);
    z-index:2;
    transform:translateY(20%);
    transition:transform 1.25s cubic-bezier(.65,.02,.2,1), z-index 0s 1.05s;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .card:before{
    content:"";position:absolute;inset:12px;
    border:1px solid rgba(178,138,58,.5);
    pointer-events:none;
  }
  .ornament{
    position:absolute;color:var(--gold);font-size:30px;opacity:.85;
  }
  .o1{top:12px;left:15px}.o2{top:12px;right:15px;transform:scaleX(-1)}
  .o3{bottom:12px;left:15px;transform:scaleY(-1)}.o4{bottom:12px;right:15px;transform:scale(-1)}
  .card-content{text-align:center;padding:28px 22px;position:relative;z-index:2}
  .small{
    text-transform:uppercase;letter-spacing:.22em;font-size:clamp(9px,2.3vw,14px);
    color:#81683b;margin-bottom:8px;
  }
  .names{
    font-family:"Great Vibes",cursive;
    font-size:clamp(43px,10vw,72px);line-height:.95;color:#a67d31;
    margin:6px 0 8px;
  }
  .surname{
    letter-spacing:.38em;font-size:clamp(11px,2.7vw,17px);margin-left:.38em;
    color:#6e5938;
  }
  .line{width:110px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto}
  .message{font-size:clamp(13px,3.2vw,19px);line-height:1.3;font-style:italic;max-width:430px;margin:auto}
  .details{
    display:flex;gap:20px;justify-content:center;align-items:flex-start;margin-top:17px;
  }
  .detail{min-width:90px}
  .icon{font-size:20px;color:var(--gold);margin-bottom:2px}
  .value{font-size:clamp(13px,3.3vw,18px);font-weight:600}
  .label{font-size:clamp(9px,2.2vw,12px);letter-spacing:.16em;text-transform:uppercase;color:#80683c}
  .place{margin-top:9px;font-size:clamp(12px,3vw,17px);font-weight:600}
  .closing{margin-top:12px;font-size:clamp(12px,2.8vw,16px);font-style:italic}

  .sparkles{position:absolute;inset:-10%;pointer-events:none;z-index:20;opacity:0}
  .sparkles i{
    position:absolute;width:5px;height:5px;border-radius:50%;
    background:#e7cc8a;box-shadow:0 0 10px #e7cc8a;
  }
  .sparkles i:nth-child(1){left:12%;top:35%}.sparkles i:nth-child(2){left:25%;top:18%}
  .sparkles i:nth-child(3){left:44%;top:10%}.sparkles i:nth-child(4){left:68%;top:20%}
  .sparkles i:nth-child(5){left:84%;top:40%}.sparkles i:nth-child(6){left:74%;top:75%}
  .sparkles i:nth-child(7){left:30%;top:82%}.sparkles i:nth-child(8){left:52%;top:72%}

  .opened .flap{transform:rotateX(180deg);z-index:1}
  .opened .card{transform:translateY(-31%);z-index:8}
  .opened .sparkles{animation:sparkle 1.6s ease-out forwards}
  .opened .hint{display:none}
  @keyframes sparkle{
    0%{opacity:0;transform:scale(.7)}
    30%{opacity:1}
    100%{opacity:0;transform:scale(1.2)}
  }
  .opened .sparkles i{animation:twinkle 1.2s ease-out both}
  .opened .sparkles i:nth-child(2){animation-delay:.08s}.opened .sparkles i:nth-child(3){animation-delay:.16s}
  .opened .sparkles i:nth-child(4){animation-delay:.24s}.opened .sparkles i:nth-child(5){animation-delay:.32s}
  .opened .sparkles i:nth-child(6){animation-delay:.4s}.opened .sparkles i:nth-child(7){animation-delay:.48s}
  .opened .sparkles i:nth-child(8){animation-delay:.56s}
  @keyframes twinkle{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(.2)}}

  .replay{
    position:absolute;right:18px;bottom:18px;z-index:40;
    border:1px solid rgba(178,138,58,.45);background:rgba(255,253,248,.82);
    color:#80683c;border-radius:999px;padding:8px 14px;font-family:inherit;
    font-size:14px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px);
    display:none;
  }
  .opened + .replay{display:block}
  @media(max-width:430px){
    .envelope-wrap{width:92vw}
    .details{gap:8px}
    .detail{min-width:80px}
    .card-content{padding:22px 15px}
    .card:before{inset:9px}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>

  <div class="envelope-wrap" id="invite" aria-label="Hochzeitseinladung öffnen" role="button" tabindex="0">
    <div class="envelope">
      <div class="back"></div>

      <div class="card">
        <span class="ornament o1">❧</span><span class="ornament o2">❧</span>
        <span class="ornament o3">❧</span><span class="ornament o4">❧</span>
        <div class="card-content">
          <div class="small">Me kënaqësi të madhe ju ftojmë</div>
          <div class="small">në dasmën tonë</div>
          <div class="names">Fehat &amp; Argjenda</div>
          <div class="surname">PODVORICA</div>
          <div class="line"></div>
          <div class="message">Do të ishte nder dhe gëzim i madh prania juaj në këtë ditë të veçantë për ne.</div>

          <div class="details">
            <div class="detail">
              <div class="icon">♡</div>
              <div class="value">16.08.27</div>
              <div class="label">E hënë</div>
            </div>
            <div class="detail">
              <div class="icon">◷</div>
              <div class="value">19:00</div>
              <div class="label">Ora</div>
            </div>
            <div class="detail">
              <div class="icon">⌖</div>
              <div class="value">Restaurant Ora</div>
              <div class="label">Podujeva, Kosovë</div>
            </div>
          </div>

          <div class="line"></div>
          <div class="closing">Ju presim me shumë dashuri!</div>
        </div>
      </div>

      <div class="side-left"></div>
      <div class="side-right"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">♡</div>

      <div class="sparkles">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
  </div>

  <button class="replay" id="replay">↻ Përsëri</button>
  <div class="hint">Prekni zarfin për ta hapur</div>
</div>

<script>
  const invite = document.getElementById('invite');
  const replay = document.getElementById('replay');

  function chime(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;
      [659.25, 783.99, 987.77].forEach((f,i)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0,now+i*.08);
        g.gain.linearRampToValueAtTime(.055,now+i*.08+.03);
        g.gain.exponentialRampToValueAtTime(.001,now+i*.08+.65);
        o.connect(g);g.connect(ctx.destination);
        o.start(now+i*.08);o.stop(now+i*.08+.7);
      });
    }catch(e){}
  }

  function openInvite(){
    if(!invite.classList.contains('opened')){
      invite.classList.add('opened');
      chime();
    }
  }
  invite.addEventListener('click', openInvite);
  invite.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' ') { e.preventDefault(); openInvite(); }
  });
  replay.addEventListener('click', ()=>{
    invite.classList.remove('opened');
    setTimeout(openInvite, 80);
  });
</script>
</body>
</html>
